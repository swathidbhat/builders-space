name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The Phase 3 PR targets the Phase 2 branch until that merges, then this
    # pull request is retargeted at main. Both bases run the same checks.
    branches:
      - main
      - cursor/phase2-tooling-testing-a797

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
